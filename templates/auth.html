<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Question Generator - Auth</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>
  <!-- Loader -->
  <div id="loader" class="loader-container d-none">
    <div class="spinner"></div>
    <p>Processing...</p>
  </div>

  <!-- Main Auth Container -->
  <div class="auth-container">
    <div class="card p-4 shadow-lg rounded-4">
      <h2 class="text-center mb-4 fw-bold text-success">Smart Question Generator</h2>

      <!-- Toggle Buttons -->
      <div class="d-flex justify-content-around mb-3 toggle-btn-group">
        <button id="loginToggle" class="btn btn-outline-success active">Login</button>
        <button id="registerToggle" class="btn btn-outline-success">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" method="POST" action="/login" class="needs-validation form-section" novalidate>
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" name="email" required>
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" name="password" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-success">Login</button>
        </div>
      </form>

      <!-- Register Form -->
      <form id="registerForm" method="POST" action="/register" class="needs-validation form-section d-none" novalidate>
        <div class="mb-3">
          <label for="registerEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="registerEmail" name="email" required>
        </div>
        <div class="mb-3">
          <label for="registerPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="registerPassword" name="password" required>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirm_password" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-success">Register</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
