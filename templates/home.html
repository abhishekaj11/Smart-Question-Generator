<!DOCTYPE html>
<html>
<head>
    <title>Smart Question Generator - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .card {
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .welcome-section {
            background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .syllabus-card {
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Smart Question Generator</a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="/logout">Logout</a>
                </div>
            </div>
        </nav>

        <div class="welcome-section">
            <h2>Welcome, {{ user }} 🎉</h2>
            <p class="mb-0">Generate smart questions from your syllabus</p>
        </div>

        <div class="card">
            <div class="card-body">
                <form method="GET" class="row g-3">
                    <div class="col-md-8">
                        <label for="subcode" class="form-label">Subject Code or Name</label>
                        <input type="text" class="form-control" id="subcode" name="subcode" 
                               placeholder="Enter subject code or name" required>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100" formaction="/generate">
                            Generate Questions <i class="bi bi-lightning-charge"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        {% if syllabus %}
        <div class="card syllabus-card">
            <div class="card-header">
                <h5 class="card-title mb-0">Generated Questions</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <tbody>
                            <tr>
                                <td>{{syllabus}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
